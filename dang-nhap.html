<!DOCTYPE html>
<!-- Trang ĐĂNG NHẬP / ĐĂNG KÝ — dữ liệu thành viên lưu vào Google Sheet (xem HUONG-DAN-GOOGLE-SHEET.md) -->
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập — NGUYEN QUY SON</title>
  <meta name="theme-color" content="#030409" />
  <meta name="description" content="Đăng ký / đăng nhập thành viên website của NGUYEN QUY SON." />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff004c'/%3E%3Cstop offset='0.25' stop-color='%23ffea00'/%3E%3Cstop offset='0.5' stop-color='%2300ffd5'/%3E%3Cstop offset='0.75' stop-color='%2300a8ff'/%3E%3Cstop offset='1' stop-color='%23e100ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="progress"></div>
  <canvas id="space" aria-hidden="true"></canvas>

  <div data-partial="nav"></div>

  <main class="auth-stage">
    <div class="container auth-layout">
      <section class="auth-intro reveal">
        <p class="auth-kicker"><span class="auth-marker"></span> MEMBER SPACE / 2026</p>
        <h1>Chào mừng trở lại,<br /><span class="grad-text">Sơn đang đợi bạn.</span></h1>
        <p class="auth-intro-copy">Một góc nhỏ để lưu lại những câu chuyện, sở thích và khoảnh khắc đáng nhớ.</p>
        <div class="auth-signature" aria-hidden="true">
          <span class="auth-index">01</span>
          <span class="auth-rule"></span>
          <span class="auth-signature-label">NGUYEN QUY SON · PERSONAL SPACE</span>
        </div>
      </section>

      <section class="auth-panel reveal" id="authForms" aria-label="Đăng nhập hoặc đăng ký">
        <div class="auth-panel-heading">
          <p class="auth-eyebrow">THÀNH VIÊN</p>
          <h2>Khu vực của bạn</h2>
          <p>Tiếp tục hành trình của mình.</p>
        </div>

        <div class="auth-tabs">
          <button type="button" class="auth-tab" id="tabLogin">Đăng nhập</button>
          <button type="button" class="auth-tab" id="tabReg">Tạo tài khoản</button>
        </div>

        <div id="formArea">
          <div id="loginBox">
            <form id="loginForm" class="auth-form">
              <label class="auth-field">
                <span>Email</span>
                <input type="email" name="email" placeholder="ten@example.com" autocomplete="email" required />
              </label>
              <label class="auth-field">
                <span>Mật khẩu</span>
                <input type="password" name="pass" placeholder="Nhập mật khẩu" autocomplete="current-password"
                  required />
              </label>
              <button type="submit" class="btn btn-primary auth-submit">Đăng nhập</button>
            </form>
            <p class="auth-msg" id="loginMsg" aria-live="polite"></p>
          </div>

          <div id="regBox" style="display: none;">
            <form id="regForm" class="auth-form">
              <label class="auth-field">
                <span>Họ và tên</span>
                <input type="text" name="name" placeholder="Tên của bạn" autocomplete="name" required />
              </label>
              <label class="auth-field">
                <span>Email</span>
                <input type="email" name="email" placeholder="ten@example.com" autocomplete="email" required />
              </label>
              <label class="auth-field">
                <span>Số điện thoại</span>
                <input type="tel" name="phone" placeholder="0912345678" autocomplete="tel" inputmode="tel" required />
              </label>
              <label class="auth-field">
                <span>Mật khẩu</span>
                <input type="password" name="pass" placeholder="Tối thiểu 6 ký tự" autocomplete="new-password"
                  required />
              </label>
              <label class="auth-field">
                <span>Nhập lại mật khẩu</span>
                <input type="password" name="pass2" placeholder="Nhập lại mật khẩu" autocomplete="new-password"
                  required />
              </label>
              <button type="submit" class="btn btn-primary auth-submit">Tạo tài khoản</button>
            </form>
            <p class="auth-msg" id="regMsg" aria-live="polite"></p>
          </div>
        </div>

        <div id="loggedBox" style="display: none;">
          <h3 id="loggedName"></h3>
          <p id="loggedEmail"></p>
          <button type="button" class="btn btn-ghost auth-submit" id="logoutBtn">Đăng xuất</button>
        </div>
      </section>
    </div>
  </main>

  <div data-partial="footer"></div>

  <script src="partials.js"></script>
  <script src="space.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>

</html>
