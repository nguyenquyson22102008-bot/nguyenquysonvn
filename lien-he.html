<!DOCTYPE html>
<!-- Trang LIÊN HỆ — website cá nhân của Sơn. Chỗ có dấu ✏️ cần sửa email / số điện thoại / địa chỉ thật. -->
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liên hệ — NGUYEN QUY SON</title>
  <meta name="theme-color" content="#030409" />
  <meta name="description" content="Liên hệ với Sơn — hợp tác, đặt sản phẩm hoặc chào hỏi." />
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff004c'/%3E%3Cstop offset='0.25' stop-color='%23ffea00'/%3E%3Cstop offset='0.5' stop-color='%2300ffd5'/%3E%3Cstop offset='0.75' stop-color='%2300a8ff'/%3E%3Cstop offset='1' stop-color='%23e100ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='70' font-size='54' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="progress"></div>
  <canvas id="space" aria-hidden="true"></canvas>

  <div data-partial="nav"></div>

  <!-- ===== Đầu trang ===== -->
  <header class="page-hero">
    <div class="container reveal">
      <div class="sec-tag">Liên hệ</div>
      <h1>Kết nối <span class="grad-text">với mình</span></h1>
      <p>Muốn hợp tác, mua sản phẩm hay đơn giản là chào hỏi? Đừng ngại nhắn cho mình!</p>
    </div>
  </header>

  <!-- ===== Nội dung liên hệ ===== -->
  <section class="tight">
    <div class="container">
      <div class="contact-grid grid-2">
        <div class="reveal">
          <p style="color: var(--muted);">
            Mình sẽ phản hồi trong thời gian sớm nhất. Ngoài ra bạn cũng có thể tìm mình qua:
          </p>
          <!-- ✏️ Sửa email / số điện thoại / địa chỉ của bạn ở đây -->
          <div class="contact-info">
            <div class="contact-row"><span>son@example.com</span></div>
            <div class="contact-row"><span>0123 456 789</span></div>
            <div class="contact-row"><span>Việt Nam</span></div>
          </div>
        </div>
        <div class="card reveal" style="--d:.1s">
          <form id="contactForm">
            <input type="text" name="name" placeholder="Tên của bạn *" required />
            <input type="email" name="email" placeholder="Email của bạn *" required />
            <textarea name="message" rows="5" placeholder="Nội dung tin nhắn... *" required></textarea>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Gửi tin nhắn</button>
            <p id="formSuccess">Cảm ơn bạn! Mình sẽ phản hồi sớm nhất có thể.</p>
          </form>
        </div>
      </div>
    </div>
  </section>

  <div data-partial="footer"></div>

  <script src="partials.js"></script>
  <script src="space.js"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>

</html>
