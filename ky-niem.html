  <!-- ===== Xem ảnh toàn màn hình ===== -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lb-btn lb-close" type="button" aria-label="Đóng">&#215;</button>
    <button class="lb-btn lb-prev" type="button" aria-label="Ảnh trước">&#8249;</button>
    <figure class="lb-figure">
      <img id="lightboxImg" src="" alt="" />
      <figcaption id="lightboxCap"></figcaption>
    </figure>
    <button class="lb-btn lb-next" type="button" aria-label="Ảnh sau">&#8250;</button>

  <script src="partials.js"></script>

  <script src="auth.js"></script>
  <script>
    // Lightbox — nhấn vào ảnh để mở xem toàn màn hình, nút ‹ › hoặc phím mũi tên để đổi ảnh, Esc để đóng
    (function () {
      var cards = Array.prototype.slice.call(document.querySelectorAll(".memory-grid img"));
      var lb = document.getElementById("lightbox");
      var lbImg = document.getElementById("lightboxImg");
      var lbCap = document.getElementById("lightboxCap");
      var current = 0;

      function show(i) {
        current = (i + cards.length) % cards.length;
        var img = cards[current];
        lbImg.src = img.currentSrc || img.src;
        lbImg.alt = img.alt;
        var cap = img.closest("figure").querySelector("figcaption");
        lbCap.textContent = cap ? cap.textContent : "";
      }

      function open(i) {
        show(i);
        lb.classList.add("open");
        lb.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
      }

      function close() {
        lb.classList.remove("open");
        lb.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
      }

      cards.forEach(function (img, i) {
        img.style.cursor = "zoom-in";
        img.addEventListener("click", function () { open(i); });
      });
      document.querySelector(".lb-prev").addEventListener("click", function () { show(current - 1); });
      document.querySelector(".lb-next").addEventListener("click", function () { show(current + 1); });
      document.querySelector(".lb-close").addEventListener("click", close);
      lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
      window.addEventListener("keydown", function (e) {
        if (!lb.classList.contains("open")) return;
        if (e.key === "Escape") close();
        if (e.key === "ArrowLeft") show(current - 1);
        if (e.key === "ArrowRight") show(current + 1);
      });
    })();
  </script>
